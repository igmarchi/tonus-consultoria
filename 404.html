<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Página não encontrada | Tonus Consultoria</title>
<link rel="icon" href="/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,500&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{--navy:#1B3A5C;--gold:#C8973A;--burg:#5C1F3A;--cream:#F7F4EF;}
  *{box-sizing:border-box;margin:0;}
  body{min-height:100vh;background:var(--navy);color:var(--cream);font-family:'DM Sans',sans-serif;display:flex;align-items:center;justify-content:center;padding:40px 24px;font-variant-numeric:lining-nums;}
  .box{max-width:620px;text-align:center;}
  .marca{font-family:'Cormorant Garamond',serif;letter-spacing:8px;font-size:22px;margin-bottom:48px;}
  .marca span{display:block;font-family:'DM Sans',sans-serif;font-size:10px;letter-spacing:5px;color:var(--gold);margin-top:4px;}
  .pontos{display:flex;justify-content:center;align-items:center;gap:14px;margin-bottom:36px;}
  .pontos i{display:block;border-radius:50%;}
  .p1{width:14px;height:14px;background:#4A5553;}
  .linha{width:70px;height:3px;background:var(--gold);opacity:.35;border-radius:2px;}
  .p2{width:22px;height:22px;border:2px dashed var(--gold);background:transparent;}
  h1{font-family:'Cormorant Garamond',serif;font-weight:500;font-size:clamp(34px,6vw,52px);line-height:1.1;margin-bottom:18px;}
  h1 em{color:var(--gold);}
  p{color:rgba(247,244,239,.75);font-size:16px;line-height:1.7;margin-bottom:34px;}
  .acoes{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;}
  a.btn{display:inline-block;text-decoration:none;padding:15px 26px;font-size:11px;letter-spacing:2.5px;font-weight:700;}
  .b1{background:var(--gold);color:var(--navy);}
  .b2{border:1px solid rgba(247,244,239,.35);color:var(--cream);}
  a.btn:focus-visible{outline:2px solid var(--gold);outline-offset:3px;}
</style>
</head>
<body>
  <main class="box">
    <div class="marca">TONUS<span>CONSULTORIA</span></div>
    <div class="pontos" aria-hidden="true"><i class="p1"></i><i class="linha"></i><i class="p2"></i></div>
    <h1>Esta página saiu do <em>caminho.</em></h1>
    <p>O endereço que você abriu não existe mais ou mudou de lugar. Acontece com qualquer negócio: o importante é saber para onde ir agora.</p>
    <div class="acoes">
      <a class="btn b1" href="/">VOLTAR PARA O INÍCIO</a>
      <a class="btn b2" href="/#contato">AGENDAR MEU DIAGNÓSTICO</a>
    </div>
  </main>
</body>
</html>
